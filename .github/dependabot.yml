version: 2
updates:
  # ========================================
  # GitHub Actions
  # ========================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ========================================
  # Composer (vendor/ is committed; Dependabot updates composer.json and composer.lock only.
  # These PRs are not auto-merged: refresh vendor/ by hand with `composer update`
  # so the shipped code and vendor/composer/installed.json match the lockfile.)
  # ========================================
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      composer-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ========================================
  # Docker
  # ========================================
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ========================================
  # docker-compose (local development stack)
  # ========================================
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-compose-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ========================================
  # pre-commit
  # ========================================
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pre-commit-minor-patch:
        update-types:
          - "minor"
          - "patch"
